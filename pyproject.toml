[project]
name = "alpaca-market-agent"
version = "0.1.0"
description = "Autonomous SPY options agent for the Alpaca AI Trading Agents Hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-mcp-server>=2.3.0,<3",
    "fastapi>=0.116.1,<1",
    "google-cloud-firestore>=2.29.0,<3",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.10.1,<3",
    "uvicorn>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
