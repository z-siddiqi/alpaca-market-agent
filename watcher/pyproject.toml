[project]
name = "alpaca-position-watcher"
version = "0.1.0"
description = "Continuous position management for the Alpaca market agent"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-firestore>=2.29.0,<3",
    "httpx>=0.28.1,<1",
]

[project.scripts]
position-watcher = "position_watcher.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/position_watcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
